<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahim Ahsan Khan — CP Profile</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d0f14'/%3E%3Ctext x='4' y='23' font-family='monospace' font-size='20' font-weight='bold' fill='%2300e5a0'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --surface2: #1c2030;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.14);
    --accent: #00e5a0;
    --accent2: #3d7fff;
    --accent3: #ff6b6b;
    --accent4: #ffd166;
    --text: #e8eaf2;
    --muted: #6b7280;
    --h1: #ffffff;
    --card-num: #ffffff;
    --grid-line: rgba(0,229,160,0.03);
    --mono: 'Space Mono', monospace;
    --sans: 'Sora', sans-serif;
    --theme-transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
  }

  [data-theme="light"] {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #e8edf3;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.18);
    --accent: #00a372;
    --accent2: #2563eb;
    --accent3: #dc2626;
    --accent4: #d97706;
    --text: #1e293b;
    --muted: #64748b;
    --h1: #0f172a;
    --card-num: #0f172a;
    --grid-line: rgba(0,163,114,0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
    transition: var(--theme-transition);
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
    transition: background-image 0.35s ease;
  }

  .theme-toggle {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 100;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 50px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 2px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    transition: var(--theme-transition), box-shadow 0.25s;
  }

  .theme-toggle:hover { box-shadow: 0 6px 32px rgba(0,0,0,0.26); }

  .theme-btn {
    border: none;
    background: transparent;
    border-radius: 40px;
    padding: 7px 14px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .theme-btn.active {
    background: var(--accent);
    color: #fff;
    font-weight: 700;
  }

  [data-theme="light"] .theme-btn.active { color: #0f172a; }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }

  .avatar-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 22px;
    color: #0d0f14;
    flex-shrink: 0;
    position: relative;
  }

  .avatar::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    z-index: -1;
    opacity: 0.3;
    filter: blur(6px);
  }

  .name-block h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--h1);
    transition: color 0.35s;
  }

  .handle {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .handle b { color: var(--accent); }

  .meta-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .pill {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .accuracy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    grid-auto-rows: 1fr;
    gap: 12px;
    margin-bottom: 40px;
  }

  @media (max-width: 420px) {
    .accuracy-grid { grid-template-columns: repeat(2, 1fr); }
  }

  .acc-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s, background 0.25s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    position: relative;
    overflow: hidden;
  }

  .acc-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }

  .acc-card:hover {
    transform: translateY(-3px);
    background: var(--surface2);
  }

  .acc-card:hover::before { opacity: 1; }

  .acc-card:active { transform: translateY(-1px) scale(0.99); }

  .acc-card[data-color="green"]:hover  { border-color: #00e5a0; box-shadow: 0 0 18px rgba(0,229,160,0.18); }
  .acc-card[data-color="blue"]:hover   { border-color: #3d7fff; box-shadow: 0 0 18px rgba(61,127,255,0.18); }
  .acc-card[data-color="cyan"]:hover   { border-color: #22d3ee; box-shadow: 0 0 18px rgba(34,211,238,0.18); }
  .acc-card[data-color="pink"]:hover   { border-color: #f472b6; box-shadow: 0 0 18px rgba(244,114,182,0.18); }
  .acc-card[data-color="teal"]:hover   { border-color: #2dd4bf; box-shadow: 0 0 18px rgba(45,212,191,0.18); }
  .acc-card[data-color="amber"]:hover  { border-color: #ffd166; box-shadow: 0 0 18px rgba(255,209,102,0.18); }
  .acc-card[data-color="purple"]:hover { border-color: #a78bfa; box-shadow: 0 0 18px rgba(167,139,250,0.18); }

  .acc-card .visit-hint {
    display: none;
  }

  .acc-card::after {
    content: 'VIEW PROFILE';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 7px 0;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-align: center;
    color: #fff;
    border-radius: 0 0 12px 12px;
    transform: translateY(100%);
    transition: transform 0.22s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.2s;
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }

  .acc-card:hover::after {
    transform: translateY(0);
    opacity: 1;
  }

  .acc-card[data-color="green"]::after  { background: rgba(0,229,160,0.85);  color: #021a10; }
  .acc-card[data-color="blue"]::after   { background: rgba(61,127,255,0.85); color: #fff; }
  .acc-card[data-color="cyan"]::after   { background: rgba(34,211,238,0.85); color: #021a1f; }
  .acc-card[data-color="pink"]::after   { background: rgba(244,114,182,0.85); color: #fff; }
  .acc-card[data-color="teal"]::after   { background: rgba(45,212,191,0.85); color: #021a18; }
  .acc-card[data-color="amber"]::after  { background: rgba(255,209,102,0.85); color: #1a1200; }
  .acc-card[data-color="purple"]::after { background: rgba(167,139,250,0.85); color: #1a0f33; }

  @media (prefers-reduced-motion: reduce) {
    .acc-card::after {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
  }

  .platform-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .acc-info .platform-name {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    letter-spacing: 0.5px;
  }

  .acc-info .acc-val {
    font-size: 18px;
    font-weight: 700;
    font-family: var(--mono);
    color: var(--card-num);
    line-height: 1.2;
    transition: color 0.35s;
  }

  .acc-info .acc-val span {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  @media (max-width: 600px) {
    .header { flex-direction: column; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    transition: var(--theme-transition);
  }

  .card-title {
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .chart-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: center;
  }

  @media (max-width: 600px) {
    .chart-card { grid-template-columns: 1fr; }
  }

  .chart-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    flex-shrink: 0;
  }

  .chart-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .chart-center .big {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--card-num);
    transition: color 0.35s;
  }

  .chart-center .small {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
  }

  .legend-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .legend-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text);
  }

  .legend-list .dot-sq {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-list .pct {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }

  .problems-row {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }

  .prob-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
  }

  .prob-card .num {
    font-family: var(--mono);
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    display: block;
  }

  .prob-card .label {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 4px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card, .acc-card, .prob-card {
    animation: fadeUp 0.5s ease both;
  }

  .acc-card:nth-child(1) { animation-delay: 0.05s; }
  .acc-card:nth-child(2) { animation-delay: 0.10s; }
  .acc-card:nth-child(3) { animation-delay: 0.15s; }
  .acc-card:nth-child(4) { animation-delay: 0.20s; }
  .acc-card:nth-child(5) { animation-delay: 0.25s; }
  .acc-card:nth-child(6) { animation-delay: 0.30s; }
  .rtab {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .rtab:hover { border-color: var(--border2); color: var(--text); }
  .rtab.active { background: var(--accent); border-color: var(--accent); color: #0d0f14; font-weight: 700; }

  .rating-stat {
    background: var(--surface2);
    border-radius: 10px;
    padding: 10px 16px;
    font-family: var(--mono);
  }
  .rating-stat .rs-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .rating-stat .rs-val { font-size: 18px; font-weight: 700; color: var(--card-num); transition: color 0.35s; }
  .copyright {
    text-align: center;
    padding: 32px 0 20px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    transition: color 0.35s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .copyright svg { opacity: 0.5; }
</style>
</head>
<body>
<div class="theme-toggle" role="group" aria-label="Theme selector">
  <button class="theme-btn active" id="btn-dark" onclick="setTheme('dark')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    Dark
  </button>
  <button class="theme-btn" id="btn-light" onclick="setTheme('light')">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    Light
  </button>
</div>

<div class="container">

  <header class="header">
    <div class="avatar-wrap">
      <div class="avatar">FK</div>
      <div class="name-block">
        <h1>Fahim Ahsan Khan</h1>
        <p class="handle">Bangladesh <svg viewBox="0 0 20 12" width="18" height="11" style="vertical-align:-1px;border-radius:2px;" aria-label="Bangladesh flag" role="img"><rect width="20" height="12" fill="#006a4e"/><circle cx="9" cy="6" r="3.6" fill="#f42a41"/></svg></p>
      </div>
    </div>
    <div class="meta-pills">
      <div class="pill"><span class="dot"></span>Active</div>
      <div class="pill" id="pill-last-updated">Last updated: …</div>
    </div>
  </header>

  <div class="section-label">Problems Solved</div>
  <div class="problems-row">
    <div class="prob-card">
      <span class="num" id="summary-solved">—</span>
      <div class="label">Solved</div>
    </div>
  </div>

  <div class="accuracy-grid" id="solved-grid"></div>

  <div class="section-label" style="margin-top:40px;">Contest Rating History</div>

  <div class="card rating-card" style="margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;">
      <div class="card-title" style="margin-bottom:0;">Rating over time</div>
      <div style="display:flex;gap:8px;" id="rating-tabs">
        <button class="rtab active" data-platform="codeforces">Codeforces</button>
        <button class="rtab" data-platform="codechef">CodeChef</button>
        <button class="rtab" data-platform="hackerrank">HackerRank</button>
      </div>
    </div>
    <div style="position:relative;width:100%;height:280px;">
      <canvas id="ratingChart" role="img" aria-label="Line chart of contest rating history">Rating history across contests</canvas>
    </div>
    <div id="rating-stats" style="display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;"></div>
  </div>

  <div class="section-label" style="margin-top:40px;">Submission Breakdown</div>
  <div class="card chart-card" style="margin-bottom:16px;">
    <div>
      <div class="card-title">Total Submissions</div>
      <p id="chart-card-subtitle" style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;">Loading…</p>
      <ul class="legend-list" id="legend-list"></ul>
    </div>
    <div class="chart-wrap">
      <canvas id="donut" role="img" aria-label="Submission verdict breakdown"></canvas>
      <div class="chart-center">
        <span class="big" id="donut-total">—</span>
        <span class="small">total</span>
      </div>
    </div>
  </div>

  <div class="copyright" id="copyright"></div>

</div>

<script>
  const donutColors = ['#00e5a0','#ffd166','#ff6b6b','#60a5fa','#a78bfa','#f97316','#94a3b8'];
  const donutLabels = ['Accepted','Partially Solved','Wrong Answer','TLE','Runtime Error','Compile Error','Others'];

  let ratingData = {};
  let ratingChart = null;
  let donutChart = null;

  function normalizeProfileData(raw) {
    if (!raw || typeof raw !== 'object') return {};
    if (Array.isArray(raw.platforms)) return raw;
    if (raw.codeforces != null && raw.leetcode != null && raw.uva != null) {
      const cf = raw.codeforces;
      const lc = raw.leetcode;
      const cc = raw.codechef || {};
      const uva = raw.uva;
      const bc = raw.beecrowd || {};
      const hr = raw.hackerrank || {};
      const loj = raw.lightoj || {};
      const bcProfileId = bc.profile_id != null ? bc.profile_id : 74808;
      const bcUrl =
        bc.url || `https://judge.beecrowd.com/en/profile/${encodeURIComponent(String(bcProfileId))}`;
      const hrUrl = `https://www.hackerrank.com/profile/${encodeURIComponent(hr.handle || 'loop_breaker')}`;
      const lojUrl = `https://lightoj.com/user/${encodeURIComponent(loj.handle || 'loop_breaker')}`;
      const solvedSum =
        (cf.solved || 0) +
        (lc.solved || 0) +
        (cc.solved || 0) +
        (uva.solved || 0) +
        (bc.solved || 0) +
        (hr.solved || 0) +
        (loj.solved || 0);
      const existingRating = raw.rating || {};
      const existingCf = existingRating.codeforces || {};
      const existingCc = existingRating.codechef || {};
      const existingHr = existingRating.hackerrank || {};
      const fromFlatContests = Array.isArray(cf.contests) ? cf.contests : [];
      const fromFlatCcContests = Array.isArray(cc.contests) ? cc.contests : [];
      const fromFlatHrContests = Array.isArray(hr.contests) ? hr.contests : [];
      const contestsCf =
        Array.isArray(existingCf.contests) && existingCf.contests.length > 0
          ? existingCf.contests
          : fromFlatContests;
      const contestsCc =
        Array.isArray(existingCc.contests) && existingCc.contests.length > 0
          ? existingCc.contests
          : fromFlatCcContests;
      const contestsHr =
        Array.isArray(existingHr.contests) && existingHr.contests.length > 0
          ? existingHr.contests
          : fromFlatHrContests;
      return {
        meta: raw.meta || {},
        summary: {
          solved: raw.summary && raw.summary.solved != null ? raw.summary.solved : solvedSum,
          attempted: raw.summary && raw.summary.attempted != null ? raw.summary.attempted : null
        },
        platforms: [
          {
            name: 'Codeforces',
            solved: cf.solved,
            url: `https://codeforces.com/profile/${encodeURIComponent(cf.handle || '')}`,
            favicon: 'https://codeforces.com/favicon.ico',
            color: 'green'
          },
          {
            name: 'LeetCode',
            solved: lc.solved,
            url: `https://leetcode.com/${encodeURIComponent(lc.handle || '')}/`,
            favicon: 'https://leetcode.com/favicon.ico',
            color: 'blue'
          },
          {
            name: 'CodeChef',
            solved: cc.solved,
            url: `https://www.codechef.com/users/${encodeURIComponent(cc.handle || 'loop_breaker')}`,
            favicon: 'https://www.codechef.com/favicon.ico',
            color: 'amber'
          },
          {
            name: 'UVa',
            solved: uva.solved,
            url: uva.user_id != null && uva.user_id !== ''
              ? `https://uhunt.onlinejudge.org/id/${encodeURIComponent(String(uva.user_id))}`
              : 'https://uhunt.onlinejudge.org/',
            favicon: 'https://uhunt.onlinejudge.org/images/uva.png',
            color: 'teal'
          },
          {
            name: 'Beecrowd',
            solved: bc.solved,
            url: bcUrl,
            favicon: 'https://judge.beecrowd.com/favicon.ico',
            color: 'cyan'
          },
          {
            name: 'HackerRank',
            solved: hr.solved,
            url: hrUrl,
            favicon: 'https://www.hackerrank.com/favicon.ico',
            color: 'pink'
          },
          {
            name: 'LightOJ',
            solved: loj.solved,
            url: lojUrl,
            favicon: 'https://lightoj.com/loj-favicon.png',
            color: 'purple'
          }
        ],
        submissions: raw.submissions || { total: 0, percentages: [0, 0, 0, 0, 0, 0, 0], source: '' },
        rating: {
          codeforces: {
            label: 'Codeforces',
            color: '#3080cf',
            contests: [],
            ...existingCf,
            contests: contestsCf
          },
          codechef: {
            label: 'CodeChef',
            color: '#6b5b2f',
            contests: [],
            ...existingCc,
            contests: contestsCc
          },
          hackerrank: {
            label: 'HackerRank',
            color: '#2ec866',
            contests: [],
            ...existingHr,
            contests: contestsHr
          }
        }
      };
    }
    return raw;
  }

  function buildSolvedGrid(platforms) {
    const grid = document.getElementById('solved-grid');
    grid.innerHTML = '';
    platforms.forEach(p => {
      const solved = p.solved ?? 0;
      const a = document.createElement('a');
      a.className = 'acc-card';
      a.href = p.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.dataset.color = p.color;
      const errHint = p.error ? ` title="Last sync failed; showing cached value"` : '';
      a.innerHTML = `
      <div class="platform-icon" style="background:var(--surface2);display:flex;align-items:center;justify-content:center;">
        <img src="${p.favicon}" width="18" height="18" style="border-radius:3px;object-fit:contain;"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
        <span style="display:none;font-size:13px;">${p.name[0]}</span>
      </div>
      <div class="acc-info" style="flex:1;min-width:0;">
        <div class="platform-name">${p.name}</div>
        <div class="acc-val"${errHint}>${solved}<span> solved</span></div>
      </div>`;
      a.addEventListener('click', e => {
        e.preventDefault();
        window.open(p.url, '_blank', 'noopener,noreferrer');
      });
      grid.appendChild(a);
    });
  }

  function renderDonut(submissions) {
    const sub = submissions || { total: 0, percentages: [0,0,0,0,0,0,0], source: '' };
    const pctArr = sub.percentages || [];
    document.getElementById('donut-total').textContent = sub.total != null ? sub.total : '—';

    const subEl = document.getElementById('chart-card-subtitle');
    if (subEl) {
      subEl.textContent = sub.source === 'codeforces'
        ? 'Verdict breakdown from your Codeforces submissions (same totals as Codeforces API).'
        : 'Submission breakdown from synced data.';
    }

    const legend = document.getElementById('legend-list');
    legend.innerHTML = donutLabels.map((lab, i) => {
      const p = pctArr[i] != null ? pctArr[i] : 0;
      const col = donutColors[i];
      return `<li><span class="dot-sq" style="background:${col};"></span> ${lab} <span class="pct">${p}%</span></li>`;
    }).join('');

    const ctx = document.getElementById('donut');
    if (donutChart) donutChart.destroy();
    donutChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: donutLabels,
        datasets: [{
          data: pctArr.length ? pctArr : donutLabels.map(() => 0),
          backgroundColor: donutColors,
          borderWidth: 0,
          hoverOffset: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '72%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: c => {
                const v = typeof c.parsed === 'number' ? c.parsed : (c.raw ?? '');
                return ` ${c.label}: ${v}%`;
              }
            }
          }
        }
      }
    });
  }

  function renderRating(platform) {
    const d = ratingData[platform];
    const statsEl = document.getElementById('rating-stats');
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const tickColor  = isLight ? '#64748b' : '#6b7280';
    const gridColor  = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.04)';
    const ttBg       = isLight ? '#ffffff' : '#1c2030';
    const ttBorder   = isLight ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.12)';
    const ttTitle    = isLight ? '#0f172a' : '#e8eaf2';
    const ttBody     = isLight ? '#64748b' : '#6b7280';
    const ptBorder   = isLight ? '#f0f4f8' : '#0d0f14';

    if (!d || !d.contests || !d.contests.length) {
      statsEl.innerHTML = '<div class="rating-stat"><div class="rs-label">No contest data</div><div class="rs-val">—</div></div>';
      if (ratingChart) { ratingChart.destroy(); ratingChart = null; }
      return;
    }

    const labels = d.contests.map(c => c.date);
    const values = d.contests.map(c => c.rating);
    const displayLabels = labels.map(s => {
      if (!s || typeof s !== 'string') return s;
      const p = s.split('-');
      return p.length >= 2 ? `${p[0]}-${p[1]}` : s;
    });
    const positive = values.filter(v => v > 0);
    const max = values.length ? Math.max(...values) : 0;
    const min = positive.length ? Math.min(...positive) : null;
    const last = values[values.length - 1];
    const delta = values.length > 1 ? last - values[values.length - 2] : 0;

    statsEl.innerHTML = `
      <div class="rating-stat"><div class="rs-label">Current</div><div class="rs-val" style="color:${d.color}">${last}</div></div>
      <div class="rating-stat"><div class="rs-label">Peak</div><div class="rs-val">${max}</div></div>
      <div class="rating-stat"><div class="rs-label">Min</div><div class="rs-val">${min != null ? min : '—'}</div></div>
      <div class="rating-stat"><div class="rs-label">Last change</div><div class="rs-val" style="color:${delta>=0?'#00e5a0':'#ff6b6b'}">${delta>=0?'+':''}${delta}</div></div>
      <div class="rating-stat"><div class="rs-label">Contests</div><div class="rs-val">${d.contests.length}</div></div>
    `;

    if (ratingChart) ratingChart.destroy();

    const cCtx = document.getElementById('ratingChart');
    ratingChart = new Chart(cCtx, {
      type: 'line',
      data: {
        labels: displayLabels,
        datasets: [{
          label: d.label,
          data: values,
          borderColor: d.color,
          backgroundColor: d.color + '18',
          borderWidth: 2,
          pointBackgroundColor: d.color,
          pointBorderColor: ptBorder,
          pointBorderWidth: 2,
          pointRadius: 5,
          pointHoverRadius: 7,
          fill: true,
          tension: 0.35,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: { left: 38, right: 16, top: 10, bottom: 8 }
        },
        scales: {
          x: {
            ticks: {
              color: tickColor,
              font: { family: 'Space Mono', size: 10 },
              maxRotation: 40,
              minRotation: 0,
              autoSkip: true,
              maxTicksLimit: 12,
              autoSkipPadding: 28
            },
            grid: { color: gridColor },
            border: { color: gridColor }
          },
          y: {
            grace: '6%',
            ticks: {
              color: tickColor,
              font: { family: 'Space Mono', size: 10 },
              padding: 10,
              callback: v => (typeof v === 'number' && Number.isFinite(v) ? Math.round(v) : v)
            },
            grid: { color: gridColor },
            border: { color: gridColor }
          }
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: ttBg,
            borderColor: ttBorder,
            borderWidth: 1,
            titleColor: ttTitle,
            bodyColor: ttBody,
            titleFont: { family: 'Space Mono', size: 11 },
            bodyFont: { family: 'Space Mono', size: 10 },
            callbacks: {
              title: items => {
                const c = d.contests[items[0].dataIndex];
                const name = c.name || 'Contest';
                return c.date ? `${name} (${c.date})` : name;
              },
              label: item => ` Rating: ${item.parsed.y}`
            }
          }
        }
      }
    });
  }

  function formatLastUpdatedLabel(isoOrDate) {
    if (!isoOrDate) return '';
    const dt = new Date(isoOrDate);
    if (isNaN(dt.getTime())) return String(isoOrDate);
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return `${dt.getUTCDate()} ${months[dt.getUTCMonth()]} ${dt.getUTCFullYear()}`;
  }

  function applyProfile(data) {
    ratingData = data.rating || {};
    const lu = data.meta && data.meta.lastUpdated;
    const pill = document.getElementById('pill-last-updated');
    if (pill) {
      if (lu) {
        const dt = new Date(lu);
        const ds = isNaN(dt.getTime()) ? lu : formatLastUpdatedLabel(lu);
        pill.textContent = `Last updated: ${ds}`;
      } else {
        pill.textContent = 'Last updated: —';
      }
    }

    const sum = data.summary || {};
    document.getElementById('summary-solved').textContent = sum.solved != null ? sum.solved : '—';

    buildSolvedGrid(data.platforms || []);
    renderDonut(data.submissions);
    renderRating(document.querySelector('.rtab.active')?.dataset.platform || 'codeforces');
  }

  window.setTheme = function(t) {
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : '');
    document.getElementById('btn-dark').classList.toggle('active', t === 'dark');
    document.getElementById('btn-light').classList.toggle('active', t === 'light');
    localStorage.setItem('cp-theme', t);
    const active = document.querySelector('.rtab.active');
    if (active && ratingData && Object.keys(ratingData).length) renderRating(active.dataset.platform);
  };

  const savedTheme = localStorage.getItem('cp-theme') || 'dark';
  if (savedTheme === 'light') window.setTheme('light');

  document.getElementById('rating-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.rtab');
    if (!btn) return;
    document.querySelectorAll('.rtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderRating(btn.dataset.platform);
  });

  (async function loadProfile() {
    try {
      const res = await fetch('data.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(String(res.status));
      applyProfile(normalizeProfileData(await res.json()));
    } catch (e) {
      document.getElementById('pill-last-updated').textContent = 'Could not load data.json';
      document.getElementById('chart-card-subtitle').textContent = 'Ensure data.json is present (see scripts/update_data.py and the GitHub workflow).';
    }
  })();

  (function() {
    const startYear = 2026;
    const currentYear = new Date().getFullYear();
    const yearStr = currentYear > startYear ? `${startYear}\u2013${currentYear}` : `${startYear}`;
    document.getElementById('copyright').innerHTML = `
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M14.83 14.83a4 4 0 1 1 0-5.66"/>
      </svg>
      ${yearStr} Fahim Ahsan Khan. All rights reserved.
    `;
  })();
</script>
</body>
</html>
